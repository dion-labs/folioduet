# Deploy the static Vite build to Cloudflare Pages.
# Runs only on pushes to main — never on pull_request.
#
# Required GitHub Actions secrets (repo or org):
#   CLOUDFLARE_API_TOKEN   — Pages edit permission for the account
#   CLOUDFLARE_ACCOUNT_ID
#
# Required GitHub Actions variables (or secrets) for the Vite build:
#   VITE_FIREBASE_API_KEY
#   VITE_FIREBASE_AUTH_DOMAIN
#   VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_APP_ID
#   VITE_FIREBASE_MEASUREMENT_ID   (optional)
#   VITE_FISH_AUDIO_SPONSOR_KEY    (optional — intentionally public while Fish is free)
#   VITE_GITHUB_REPO_URL           (optional — defaults in source)
#   VITE_GITHUB_SPONSORS_URL       (optional)
#
# Create the Pages project once (Dashboard or `wrangler pages project create pageecho`).
# Point your subdomain DNS at the Pages project when ready.

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID || secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FISH_AUDIO_SPONSOR_KEY: ${{ secrets.VITE_FISH_AUDIO_SPONSOR_KEY }}
          VITE_GITHUB_REPO_URL: ${{ vars.VITE_GITHUB_REPO_URL || 'https://github.com/dion-labs/pageecho' }}
          VITE_GITHUB_SPONSORS_URL: ${{ vars.VITE_GITHUB_SPONSORS_URL || 'https://github.com/sponsors/dion-labs' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pageecho --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
